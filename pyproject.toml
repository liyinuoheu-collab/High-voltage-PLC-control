[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "donut-hasel-drive-monitor"
version = "3.0.0"
description = "Bidirectional protocol V6 monitor and controller for phase-shift Donut-HASEL experiments"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6,<7",
  "pyqtgraph>=0.13.3,<1",
  "pyserial>=3.5,<4",
]

[project.scripts]
donut-hasel-monitor = "drive_board_monitor.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
